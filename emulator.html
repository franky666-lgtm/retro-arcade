<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro OS Arcade - Emulator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").then(function() {
                if (!navigator.serviceWorker.controller) {
                    if (!sessionStorage.getItem("sw_reload")) {
                        sessionStorage.setItem("sw_reload", "1");
                        window.location.reload();
                    }
                }
            });
        }
    </script>
</head>
<body>
    <div class="emulator-header">
        <div class="header-left">
            <span class="sbp-badge-small">SBP Club</span>
            <h1 id="os-title">Lade...</h1>
        </div>
        <a href="/" class="btn-back">&larr; Zurueck</a>
    </div>

    <div class="emulator-container">
        <div id="loading" class="loading">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <span id="loadingText">System wird gestartet...</span>
        </div>

        <div id="screen_container" style="display: none;">
            <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
            <canvas style="display: none"></canvas>
        </div>

        <div class="controls" style="display: none;" id="controls">
            <button class="btn-ctrl btn-exit" onclick="if(confirm('Arcade verlassen?')) window.location.href='/';">&#10006; Verlassen</button>
            <button class="btn-ctrl" onclick="emulator.restart()">&#10227; Neustart</button>
            <button class="btn-ctrl" onclick="toggleFullscreen()">&#9974; Vollbild</button>
            <button class="btn-ctrl" onclick="emulator.keyboard_send_scancodes([0x1D, 0x38, 0x53])">Ctrl+Alt+Del</button>
            <button class="btn-ctrl" id="btnSound" onclick="toggleSound()">&#128266; Sound An</button>
            <button class="btn-ctrl btn-save" onclick="doSaveState()">&#128190; Speichern</button>
            <button class="btn-ctrl btn-restore" id="btnRestore" onclick="doRestoreState()" style="display:none;">&#128194; Wiederherstellen</button>
        </div>

        <div class="status-bar" id="status">
            Status: <span class="running">Initialisiere...</span>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Auth check — redirect and block page if not verified
        if (!ARCADE_AUTH.requireAuth()) {
            document.write('<html><body style="background:#0a0a0f;color:#888;text-align:center;margin-top:40vh;font-family:monospace"><p>Weiterleitung...</p></body></html>');
            document.close();
        }
    </script>
    <script src="v86/libv86.js"></script>
    <script src="js/savestate.js"></script>
    <script src="js/emulator.js"></script>
</body>
</html>
